services:
  app:
    image: mcr.microsoft.com/devcontainers/java:21
    volumes:
      - .:/workspaces/attendance-system:cached
    command: sleep infinity
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/attendance
      SPRING_DATASOURCE_USERNAME: attendance
      SPRING_DATASOURCE_PASSWORD: attendance
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attendance
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # src/test/resources/application.yml activates the "h2" profile by default so local
      # `./gradlew test` needs no Docker. Every property that profile sets is overridden
      # here individually (not just url/username/password) so the effective config is
      # consistently Postgres regardless of whether the h2 profile ends up active.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/attendance
      SPRING_DATASOURCE_USERNAME: attendance
      SPRING_DATASOURCE_PASSWORD: attendance
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
